services:
  api:
    build: .
    image: pharma-field-api:latest
    container_name: pharma_field_api
    restart: unless-stopped
    ports:
      - '${PORT:-3000}:3000'
    # Every var the app reads comes from .env verbatim — DATABASE_URL (Neon),
    # AWS_*, FIREBASE_*, JWT_*, SMTP_*. Nothing is redeclared here, so adding a
    # new var to .env is all it takes for the container to see it.
    env_file:
      - .env
    environment:
      NODE_ENV: production
    volumes:
      - uploads_data:/app/uploads
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  # Local-only Postgres. Production uses Neon, so this stays off unless you ask
  # for it:  docker compose --profile local up -d
  # When you do, point DATABASE_URL at it:
  #   postgresql://pharma_user:pharma_pass@postgres:5432/pharma_field_db
  postgres:
    image: postgres:16-alpine
    container_name: pharma_field_db
    profiles: ['local']
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-pharma_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pharma_pass}
      POSTGRES_DB: ${DB_NAME:-pharma_field_db}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-pharma_user} -d ${DB_NAME:-pharma_field_db}']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  uploads_data:
